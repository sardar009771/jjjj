<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Poppins;font-weight:700;src:url(../assets/fonts/Poppins-700.woff2)}
@font-face{font-family:Poppins;font-weight:800;src:url(../assets/fonts/Poppins-800.woff2)}
@font-face{font-family:Poppins;font-weight:900;src:url(../assets/fonts/Poppins-900.woff2)}
html,body{margin:0;background:transparent}
svg{display:block;font-family:Poppins}
</style></head><body>
<!-- Platzhalter-Packshot (wird nur verwendet, wenn produkt.png fehlt) -->
<svg id="p" width="900" height="1100" viewBox="0 0 900 1100">
 <defs>
  <linearGradient id="body" x1="0" x2="1">
   <stop offset="0" stop-color="#050505"/><stop offset=".18" stop-color="#2a2a2c"/>
   <stop offset=".32" stop-color="#121213"/><stop offset=".8" stop-color="#0b0b0c"/>
   <stop offset=".92" stop-color="#232325"/><stop offset="1" stop-color="#040404"/>
  </linearGradient>
  <linearGradient id="lid" x1="0" x2="1">
   <stop offset="0" stop-color="#0a0a0a"/><stop offset=".2" stop-color="#333"/>
   <stop offset=".5" stop-color="#151515"/><stop offset=".85" stop-color="#2b2b2b"/><stop offset="1" stop-color="#050505"/>
  </linearGradient>
  <linearGradient id="band" x1="0" x2="1">
   <stop offset="0" stop-color="#B8420A"/><stop offset=".2" stop-color="#FF7A2E"/>
   <stop offset=".55" stop-color="#FF6B1A"/><stop offset="1" stop-color="#A93A06"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" x2="1">
   <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".16"/>
   <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
 </defs>
 <!-- Dose -->
 <rect x="80" y="210" width="740" height="850" rx="70" fill="url(#body)"/>
 <!-- Deckel -->
 <rect x="95" y="60" width="710" height="170" rx="34" fill="url(#lid)"/>
 <g opacity=".35">
  <script>/* ribs drawn below */</script>
 </g>
 <g id="ribs"></g>
 
 <!-- Etikett -->
 <rect x="80" y="300" width="740" height="680" fill="#0d0d0e"/>
 <rect x="80" y="300" width="740" height="10" fill="url(#band)"/>
 <rect x="80" y="970" width="740" height="10" fill="url(#band)"/>
 <text x="450" y="455" text-anchor="middle" font-size="148" font-weight="900" letter-spacing="-4" fill="#fff">PRO<tspan fill="#FF6B1A">FUEL</tspan></text>
 <rect x="150" y="490" width="600" height="120" rx="14" fill="url(#band)"/>
 <text x="450" y="548" text-anchor="middle" font-size="62" font-weight="900" fill="#111">CREATINE</text>
 <text x="450" y="594" text-anchor="middle" font-size="38" font-weight="800" fill="#111" letter-spacing="6">MONOHYDRATE</text>
 <g transform="translate(450,690)">
  <rect x="-190" y="-42" width="380" height="84" rx="42" fill="none" stroke="#fff" stroke-width="4"/>
  <text y="16" text-anchor="middle" font-size="44" font-weight="800" fill="#fff">Creapure<tspan font-size="26" dy="-16">®</tspan></text>
 </g>
 <text x="450" y="800" text-anchor="middle" font-size="40" font-weight="700" fill="#cfcfcf">100 % reines Kreatin</text>
 <g font-size="31" font-weight="800" fill="#fff" text-anchor="middle">
  <text x="248" y="900">VEGAN</text>
  <text x="450" y="900" fill="#FF6B1A">146 PORT.</text>
  <text x="655" y="900">MADE IN DE</text>
 </g>
 <line x1="345" y1="870" x2="345" y2="912" stroke="#444" stroke-width="3"/>
 <line x1="555" y1="870" x2="555" y2="912" stroke="#444" stroke-width="3"/>
 <!-- Glanz -->
 <rect x="170" y="70" width="110" height="980" fill="url(#shine)"/>
 <rect x="700" y="230" width="40" height="800" fill="url(#shine)" opacity=".6"/>
</svg>
<script>
 const g=document.getElementById('ribs');let s='';
 for(let x=110;x<800;x+=22){s+=`<rect x="${x}" y="70" width="6" height="165" rx="3" fill="#000" opacity=".35"/>`}
 g.innerHTML=s;
</script>
</body></html>
