<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Poppins;font-weight:700;src:url(../assets/fonts/Poppins-700.woff2)}
@font-face{font-family:Poppins;font-weight:800;src:url(../assets/fonts/Poppins-800.woff2)}
@font-face{font-family:Poppins;font-weight:900;src:url(../assets/fonts/Poppins-900.woff2)}
html,body{margin:0;background:transparent}
svg{display:block;font-family:Poppins}
</style></head><body>
<!-- Variante 1: DX-Monogramm -->
<svg id="v1" width="1080" height="1080" viewBox="0 0 1080 1080">
 <defs>
  <radialGradient id="bg1" cx=".5" cy=".42" r=".7"><stop offset="0" stop-color="#2E3038"/><stop offset=".6" stop-color="#16171B"/><stop offset="1" stop-color="#08080A"/></radialGradient>
  <linearGradient id="or" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9A4D"/><stop offset=".5" stop-color="#FF6B1A"/><stop offset="1" stop-color="#E04E00"/></linearGradient>
  <linearGradient id="wh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9DBE2"/></linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".6"/></filter>
 </defs>
 <rect width="1080" height="1080" fill="url(#bg1)"/>
 <!-- feine Diagonal-Speedlines -->
 <g opacity=".07" stroke="#fff" stroke-width="10" stroke-linecap="round">
  <path d="M150 820 L300 670"/><path d="M220 900 L330 790"/><path d="M780 410 L930 260"/><path d="M820 470 L900 390"/>
 </g>
 <ellipse cx="540" cy="540" rx="300" ry="230" fill="#FF6B1A" opacity=".10" filter="url(#glow)"/>
 <circle cx="540" cy="540" r="488" fill="none" stroke="url(#or)" stroke-width="22"/>
 <circle cx="540" cy="540" r="452" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="4"/>
 <g transform="translate(540,600) skewX(-9)" filter="url(#sh)">
  <text x="-18" y="0" text-anchor="end" font-size="470" font-weight="900" fill="url(#wh)" letter-spacing="-10">D</text>
  <text x="-34" y="0" text-anchor="start" font-size="470" font-weight="900" fill="url(#or)" letter-spacing="-10">X</text>
 </g>
 <!-- Blitz-Akzent -->
 <path d="M612 236 L548 352 L596 352 L540 452 L660 320 L606 320 L652 236 Z" fill="#FFD23F" opacity="0"/>
 <text x="551" y="792" text-anchor="middle" font-size="62" font-weight="800" fill="#fff" letter-spacing="22" opacity=".9">SHOP</text>
 <rect x="300" y="768" width="80" height="9" rx="4.5" fill="#FF6B1A"/><rect x="700" y="768" width="80" height="9" rx="4.5" fill="#FF6B1A"/>
</svg>

<!-- Variante 2: Flamme + Hantel -->
<svg id="v2" width="1080" height="1080" viewBox="0 0 1080 1080">
 <defs>
  <radialGradient id="bg2" cx=".5" cy=".35" r=".8"><stop offset="0" stop-color="#FF8A3D"/><stop offset=".55" stop-color="#FF6B1A"/><stop offset="1" stop-color="#C9480A"/></radialGradient>
  <linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FFE7D6"/></linearGradient>
  <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#5a1c00" flood-opacity=".55"/></filter>
 </defs>
 <rect width="1080" height="1080" fill="url(#bg2)"/>
 <g opacity=".12" fill="#fff">
  <circle cx="540" cy="540" r="470"/>
 </g>
 <circle cx="540" cy="540" r="470" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="6"/>
 <g filter="url(#sh2)">
  <!-- Flamme -->
  <path d="M548 150 C 590 270 720 340 760 480 C 800 620 730 780 600 840 C 560 858 520 860 480 852 C 340 822 270 700 290 570 C 305 470 370 420 400 330 C 430 400 450 450 492 470 C 480 360 500 240 548 150 Z" fill="url(#fl)"/>
  <!-- innere Flamme (dunkel) -->
  <path d="M556 430 C 580 500 660 540 668 630 C 676 730 610 790 540 794 C 460 796 404 744 404 668 C 404 610 440 580 456 530 C 476 570 494 590 520 600 C 512 540 526 480 556 430 Z" fill="#16171B"/>
  <!-- Hantel -->
  <g transform="translate(536,690) rotate(-12)">
   <rect x="-112" y="-11" width="224" height="22" rx="11" fill="#FF6B1A"/>
   <rect x="-150" y="-52" width="40" height="104" rx="12" fill="#FF6B1A"/>
   <rect x="110" y="-52" width="40" height="104" rx="12" fill="#FF6B1A"/>
   <rect x="-178" y="-36" width="26" height="72" rx="10" fill="#FF6B1A"/>
   <rect x="152" y="-36" width="26" height="72" rx="10" fill="#FF6B1A"/>
  </g>
 </g>
</svg>

<!-- Variante 3: Wortmarke DERMESX -->
<svg id="v3" width="1080" height="1080" viewBox="0 0 1080 1080">
 <defs>
  <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E2026"/><stop offset="1" stop-color="#0A0A0C"/></linearGradient>
  <linearGradient id="or3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF9A4D"/><stop offset="1" stop-color="#FF5A0A"/></linearGradient>
 </defs>
 <rect width="1080" height="1080" fill="url(#bg3)"/>
 <!-- orange Diagonal-Band -->
 <path d="M-40 700 L1120 330 L1120 520 L-40 890 Z" fill="url(#or3)"/>
 <path d="M-40 920 L1120 550 L1120 572 L-40 942 Z" fill="#FF6B1A" opacity=".45"/>
 <g transform="translate(540,575) rotate(-17.7)">
  <text x="0" y="0" text-anchor="middle" font-size="150" font-weight="900" fill="#fff" letter-spacing="-3" style="font-style:italic">DERMESX</text>
  <text x="0" y="72" text-anchor="middle" font-size="46" font-weight="800" fill="#111" letter-spacing="16">FITNESS · SHOP</text>
 </g>
</svg>
</body></html>
